<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Gangnam Launch Mix</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <h1>유튜브 사운드패드</h1>
        <div class="status-stack">
          <p><span>상태</span><strong id="player-status">플레이어 준비 중</strong></p>
          <p><span>트랙</span><strong id="now-playing">아직 없음</strong></p>
        </div>
      </header>

      <main class="layout">
        <section class="panel player-panel">
          <div class="panel-head">
            <h2>재생</h2>
          </div>

          <div class="stack">
            <label class="field">
              <span>링크</span>
              <div class="inline-field">
                <input
                  id="url-input"
                  type="url"
                  placeholder="유튜브 링크 붙여넣기"
                />
                <button id="load-url-button" class="accent-button" type="button">재생</button>
              </div>
            </label>

            <div class="player-wrap">
              <div id="player"></div>
            </div>

            <div class="transport">
              <button id="play-button" class="ghost-button" type="button">Play</button>
              <button id="pause-button" class="ghost-button" type="button">Pause</button>
              <button id="stop-button" class="ghost-button" type="button">Stop</button>
              <label class="slider-field">
                <span id="youtube-volume-label">볼륨</span>
                <input id="youtube-volume" type="range" min="0" max="100" value="70" />
              </label>
            </div>
          </div>

          <div class="hint-card">
            <p>유튜브 링크나 11자리 영상 ID를 넣고 바로 재생하면 됩니다.</p>
          </div>
        </section>

        <section class="panel pad-panel">
          <div class="panel-head">
            <h2>패드</h2>
            <label class="slider-field compact">
              <span>패드 볼륨</span>
              <input id="pad-volume" type="range" min="0" max="100" value="100" />
            </label>
          </div>

          <div id="pad-grid" class="pad-grid"></div>

          <div class="hint-card">
            <p>모바일에서는 탭으로, 데스크톱에서는 키보드로도 누를 수 있습니다.</p>
          </div>
        </section>
      </main>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="./pad-config.js"></script>
    <script src="./pad-engine.js"></script>
    <script src="./youtube-controller.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
